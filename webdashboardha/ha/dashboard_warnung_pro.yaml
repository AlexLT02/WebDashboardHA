blueprint:
  name: Dashboard-Warnung
  description: Warnung auf dem Wand-Dashboard, Push aufs Handy und beliebige Geraete-Aktion. Mehrere Warnungen duerfen gleichzeitig laufen; angefasste Geraete werden vorher gesichert und danach exakt wiederhergestellt.
  domain: automation
  source_url: https://github.com/AlexLT02/WebDashboardHA
  input:
    ausloeser:
      name: 1 · Wann soll gewarnt werden?
      icon: mdi:eye-outline
      input:
        sensor:
          name: Geraet / Entitaet
          description: Was soll ueberwacht werden?
          selector:
            entity:
        bedingung:
          name: Bedingung
          description: >-
            Die ersten beiden Punkte verstehen alle ueblichen Schreibweisen
            (on/off, open/closed, home/not_home, detected …) — es muss also
            nichts abgetippt werden. Schwellwert und eigener Zustand darunter
            gelten nur fuer die jeweils passende Zeile.
          default: an
          selector:
            select:
              mode: dropdown
              options:
                - label: ist an / offen / erkannt
                  value: an
                - label: ist aus / zu / nicht erkannt
                  value: aus
                - label: Zahlenwert ist groesser als der Schwellwert
                  value: ueber
                - label: Zahlenwert ist kleiner als der Schwellwert
                  value: unter
                - label: Zustand ist genau … (Feld „Eigener Zustand")
                  value: text
        schwelle:
          name: Schwellwert
          description: Nur fuer „groesser/kleiner als" — z. B. 25 (Grad) oder 20 (Prozent).
          default: 0
          selector:
            number:
              min: -10000
              max: 100000
              step: 0.1
              mode: box
        eigener_zustand:
          name: Eigener Zustand
          description: >-
            Nur fuer „Zustand ist genau …". Der technische Wert, nicht die
            Anzeige — z. B. playing, heat, docked. Steht in den
            Entwicklerwerkzeugen unter „Zustaende".
          default: ""
          selector:
            text:
        dauer:
          name: Muss so lange anliegen
          description: Erst danach wird gewarnt. 0 = sofort.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
              enable_second: true
    meldung:
      name: 2 · Meldung
      icon: mdi:message-alert-outline
      input:
        meldungstext:
          name: Meldungstext
          description: Erscheint im Dashboard-Overlay und in der Push-Nachricht.
          selector:
            text:
        stufe:
          name: Dringlichkeit
          description: Bestimmt Farbe und Puls im Overlay — nicht, wer gewinnt.
          default: warnung
          selector:
            select:
              mode: dropdown
              options:
                - label: Hinweis (hellblau)
                  value: hinweis
                - label: Warnung (gelb)
                  value: warnung
                - label: Wichtig (rot)
                  value: wichtig
    benachrichtigung:
      name: 3 · Push aufs Handy
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_geraete:
          name: Zielgeraete
          description: >-
            Geraete mit Home-Assistant-App. Die Nachricht zieht sich selbst
            zurueck, sobald die Warnung vorbei ist. Leer lassen = keine Push.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_titel:
          name: Titel
          description: Leer = automatisch nach Dringlichkeit.
          default: ""
          selector:
            text:
    aktionen:
      name: 4 · Geraete-Aktion
      icon: mdi:lightbulb-group-outline
      collapsed: true
      input:
        aktion:
          name: Was soll passieren?
          description: >-
            Optional. Laeuft, solange diese Warnung angezeigt wird — bei
            mehreren gleichzeitigen Warnungen im 5-Sekunden-Wechsel. Erlaubt ist
            alles: Lampen, Szene, WLED-Preset, Schalter, Media-Player. Die
            angefassten Geraete werden automatisch erkannt, gesichert und am
            Ende wiederhergestellt.
          default:
            - delay:
                milliseconds: 1
          selector:
            action:
    erweitert:
      name: Erweitert
      icon: mdi:tune
      collapsed: true
      input:
        extra_entitaeten:
          name: Zusaetzlich sichern
          description: >-
            Normalerweise leer lassen. Die Geraete aus der Aktion oben werden
            selbst gefunden. Nur eintragen, was die Automatik nicht sehen kann —
            etwa Geraete, die per Skript oder Geraete-Aktion geschaltet werden.
          default: []
          selector:
            entity:
              multiple: true
        nachnerven:
          name: Nach dem Wegklicken erneut melden
          description: >-
            Besteht die Ursache noch, meldet sich die Warnung nach spaetestens
            5 Minuten wieder. Aus = einmal quittiert ist Ruhe, bis die Ursache
            weg war und erneut auftritt.
          default: true
          selector:
            boolean:

mode: queued
max: 20
max_exceeded: silent

# Dieselben Werte wie unter `variables` — Trigger-Templates sehen `variables`
# nicht, darum hier noch einmal. So kann der YAML-Anker `&aktiv` unten in beiden
# Welten stehen und die Ausloese-Logik existiert trotzdem nur an EINER Stelle.
trigger_variables:
  t_sensor: !input sensor
  t_bed: !input bedingung
  t_schwelle: !input schwelle
  t_eigen: !input eigener_zustand

triggers:
  # Autoritativer Start. Ein Template-Trigger statt getrennter state-/
  # numeric_state-Trigger: er deckt alle fuenf Bedingungen ab, kennt die
  # Mindestdauer ueber `for` und feuert nicht bei blossen Attribut-Aenderungen.
  - trigger: template
    id: an
    for: !input dauer
    value_template: &aktiv >-
      {%- set s = states(t_sensor) | lower | trim -%}
      {%- set an = ['on', 'open', 'opened', 'offen', 'auf', 'home', 'detected',
                    'unlocked', 'playing', 'active', 'wet', 'true', 'ein'] -%}
      {%- set aus = ['off', 'closed', 'geschlossen', 'zu', 'not_home', 'away',
                     'clear', 'locked', 'idle', 'paused', 'standby', 'dry',
                     'false'] -%}
      {%- if s in ['unknown', 'unavailable', 'none', ''] -%}
        {{ false }}
      {%- elif t_bed == 'an' -%}
        {{ s in an }}
      {%- elif t_bed == 'aus' -%}
        {{ s in aus }}
      {%- elif t_bed == 'ueber' -%}
        {{ s | float(-1000000000) > t_schwelle | float(0) }}
      {%- elif t_bed == 'unter' -%}
        {{ s | float(1000000000) < t_schwelle | float(0) }}
      {%- else -%}
        {{ s == t_eigen | lower | trim }}
      {%- endif -%}
  # Jede Zustandsaenderung -> neu bewerten (beendet die Warnung von selbst).
  - trigger: state
    entity_id: !input sensor
    id: pruef
  # Selbstheilung + Nachnerven.
  - trigger: time_pattern
    minutes: /5
    id: pruef_zeit
  # Das Register bittet um die Geraete-Aktion (Rotation).
  - trigger: event
    event_type: wdh_apply
    id: paint
  # Das Register meldet: diese Warnung ist beendet.
  - trigger: event
    event_type: wdh_cleared
    id: cleared
  - trigger: homeassistant
    event: start
    id: boot

variables:
  t_sensor: !input sensor
  t_bed: !input bedingung
  t_schwelle: !input schwelle
  t_eigen: !input eigener_zustand
  # Stabile ID dieser Warnung = die Entity-ID der Automation selbst.
  warn_id: "{{ this.entity_id }}"
  notify_tag: "wdh_{{ this.entity_id | replace('.', '_') }}"
  dauer: !input dauer
  stufe: !input stufe
  meldungstext: !input meldungstext
  notify_titel: !input notify_titel
  notify_geraete: !input notify_geraete
  nachnerven: !input nachnerven
  aktion_roh: !input aktion
  extra_entitaeten: !input extra_entitaeten
  dauer_s: >-
    {{ (dauer.hours | default(0) | int) * 3600
       + (dauer.minutes | default(0) | int) * 60
       + (dauer.seconds | default(0) | int) }}
  # Trifft die Bedingung JETZT zu? Exakt dieselbe Logik wie im Trigger.
  aktiv_jetzt: *aktiv
  # Liegt der Zustand schon lange genug an? (fuer Boot- und Nachpruef-Laeufe;
  # beim `an`-Trigger hat HA das ueber `for` bereits erledigt)
  lange_genug: >-
    {%- set st = states[t_sensor] -%}
    {%- if st is none -%}
      {{ false }}
    {%- else -%}
      {{ (now() - st.last_changed).total_seconds() >= dauer_s | int }}
    {%- endif -%}
  # Steht diese Warnung schon im Register?
  schon_aktiv: >-
    {%- set ns = namespace(found=false) -%}
    {%- for n in ['1', '2', '3', '4'] -%}
      {%- set raw = states('input_text.wdh_slot_' ~ n) -%}
      {%- if raw not in ['unknown', 'unavailable'] and raw.split('|')[0] == warn_id -%}
        {%- set ns.found = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  # Welche Geraete fasst die Aktion an? Aus dem Aktions-Editor abgelesen, damit
  # niemand die Snapshot-Liste von Hand pflegen muss. Erkannt werden `target`,
  # `data` und die alte `entity_id`-Schreibweise, auch eine Ebene tiefer (if /
  # choose / repeat). Szenen werden auf ihre Mitglieder aufgeloest — die Szene
  # selbst zu sichern brauechte niemand.
  ziel_entitaeten: >-
    {%- set ns = namespace(roh=[]) -%}
    {%- set schritte = aktion_roh | default([], true) -%}
    {%- for stufe1 in schritte -%}
      {%- if stufe1 is mapping -%}
        {%- set tiefer = (stufe1.get('sequence', []) + stufe1.get('then', [])
                          + stufe1.get('else', []) + stufe1.get('default', [])
                          + (stufe1.get('choose', []) | map(attribute='sequence')
                             | sum(start=[]))) -%}
        {%- for s in [stufe1] + (tiefer if tiefer is iterable else []) -%}
          {%- if s is mapping -%}
            {%- set t = s.get('target', {}) -%}
            {%- set d = s.get('data', {}) -%}
            {%- set treffer = [t.get('entity_id', []) if t is mapping else [],
                               d.get('entity_id', []) if d is mapping else [],
                               s.get('entity_id', [])] -%}
            {%- for e in treffer -%}
              {%- set ns.roh = ns.roh + ([e] if e is string else (e | list)) -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {%- set extra = extra_entitaeten | default([], true) -%}
    {%- set ns.roh = ns.roh + ([extra] if extra is string else (extra | list)) -%}
    {%- set ns2 = namespace(out=[]) -%}
    {%- for e in ns.roh | map('trim') | reject('eq', '') | unique | list -%}
      {%- if e.startswith('scene.') -%}
        {%- set ns2.out = ns2.out + (state_attr(e, 'entity_id') or []) -%}
      {%- else -%}
        {%- set ns2.out = ns2.out + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns2.out | unique | list }}
  # Der mobile_app-Dienst haengt am Geraetenamen bei der Registrierung — ein
  # spaeteres Umbenennen aendert ihn nicht mit. Darum beide Namen anbieten und
  # den Aufruf `continue_on_error` machen: der falsche laeuft ins Leere.
  notify_services: >-
    {%- set ns = namespace(out=[]) -%}
    {%- for d in notify_geraete | default([], true) -%}
      {%- for n in [device_attr(d, 'name'), device_attr(d, 'name_by_user')] -%}
        {%- if n -%}
          {%- set ns.out = ns.out + ['notify.mobile_app_' ~ (n | slugify)] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.out | unique | list }}

conditions: []

actions:
  # Beim HA-Start erst dem Register-Reset den Vortritt lassen.
  - if:
      - condition: trigger
        id: boot
    then:
      - delay: "00:00:20"

  - choose:
      # ── 1) Diese Warnung ist gerade dran -> Geraete-Aktion fahren ──────────
      - alias: Geraete-Aktion (diese Warnung wird gerade angezeigt)
        conditions:
          - condition: trigger
            id: paint
          - condition: template
            value_template: "{{ trigger.event.data.warn_id == warn_id }}"
        sequence: !input aktion

      # ── 2) Register meldet Ende -> Push-Nachricht zurueckziehen ───────────
      - alias: Aufraeumen nach dem Ende
        conditions:
          - condition: trigger
            id: cleared
          - condition: template
            value_template: "{{ trigger.event.data.warn_id == warn_id }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notify_tag }}"

      # ── 3) Warnung ausloesen ──────────────────────────────────────────────
      - alias: Warnung ausloesen
        conditions:
          - condition: template
            value_template: "{{ trigger.id not in ['paint', 'cleared'] }}"
          - condition: template
            value_template: "{{ aktiv_jetzt }}"
          - condition: template
            value_template: "{{ not schon_aktiv }}"
          # Beim `an`-Trigger hat HA die Dauer schon geprueft; bei den
          # Nachpruef-Laeufen muessen wir das selbst tun.
          - condition: template
            value_template: "{{ trigger.id == 'an' or lange_genug }}"
          # Nach dem Wegklicken nur erneut melden, wenn gewuenscht.
          - condition: template
            value_template: "{{ nachnerven or trigger.id in ['an', 'boot'] }}"
        sequence:
          - action: script.wdh_alarm_set
            data:
              warn_id: "{{ warn_id }}"
              text: "{{ meldungstext }}"
              stufe: "{{ stufe }}"
              entities: "{{ ziel_entitaeten }}"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: >-
                      {{ notify_titel if notify_titel else
                         ({'wichtig': 'Achtung', 'warnung': 'Warnung',
                           'hinweis': 'Hinweis'}[stufe] | default('Warnung')) }}
                    message: "{{ meldungstext }}"
                    data:
                      tag: "{{ notify_tag }}"
                      channel: "{{ 'Alarm' if stufe == 'wichtig' else 'Warnung' }}"
                      importance: high
                      push:
                        interruption-level: >-
                          {{ 'time-sensitive' if stufe == 'wichtig' else 'active' }}

      # ── 4) Ursache weg -> Warnung beenden (Register stellt alles wieder her) ─
      - alias: Warnung beenden
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['pruef', 'pruef_zeit', 'boot'] }}"
          - condition: template
            value_template: "{{ not aktiv_jetzt }}"
          - condition: template
            value_template: "{{ schon_aktiv }}"
        sequence:
          - action: script.wdh_alarm_clear
            data:
              warn_id: "{{ warn_id }}"
